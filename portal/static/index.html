<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EU-Report-Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232459c9%27/%3E%3Cpath d=%27M9 9h14M9 14h14M9 19h14M9 24h9%27 stroke=%27white%27 stroke-width=%272.4%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="nav.skip">Zum Inhalt springen</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/start" aria-label="EU-Report-Portal">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 9h14M9 14h14M9 19h14M9 24h9"/></svg></span>
        <span class="brand-text"><span class="brand-name">EU-Report-Portal</span><span class="brand-sub" data-i18n="brand.sub">Geschäftsberichte &amp; Branchenreports</span></span>
      </a>
      <div class="tools">
        <button id="btn-help" type="button" class="tool" data-i18n-title="help.open"><span aria-hidden="true">?</span><span class="tool-text" data-i18n="help.button">Hilfe</span></button>
        <div class="seg small" role="group" data-i18n-aria="settings.language">
          <button type="button" data-lang="de">DE</button><button type="button" data-lang="en">EN</button>
        </div>
        <button id="btn-theme" type="button" class="tool theme-toggle"><span class="theme-icon" aria-hidden="true"></span></button>
      </div>
    </div>
    <nav class="nav" data-i18n-aria="nav.label">
      <a href="#/start" data-route="start" data-i18n="nav.start">Start</a>
      <a href="#/company" data-route="company" data-i18n="nav.company">Unternehmen</a>
      <a href="#/compare" data-route="compare" data-i18n="nav.compare">Vergleichen</a>
      <a href="#/industry" data-route="industry" data-i18n="nav.industry">Branchen</a>
      <a href="#/search" data-route="search" data-i18n="nav.search">Suche in Berichten</a>
      <a href="#/library" data-route="library" data-i18n="nav.library">Bibliothek</a>
      <span class="nav-gap" aria-hidden="true"></span>
      <a href="#/jobs" data-route="jobs" class="secondary"><span data-i18n="nav.jobs">Aufträge</span> <span id="jobs-badge" class="badge" hidden></span></a>
      <a href="#/universe" data-route="universe" class="secondary" data-i18n="nav.universe">Alle EU-Aktien</a>
      <a href="#/settings" data-route="settings" class="secondary" data-i18n="nav.settings">Einstellungen</a>
    </nav>
  </header>
  <div id="banner" class="banner" role="status" hidden></div>
  <main id="main" tabindex="-1"></main>
  <footer class="foot" data-i18n="footer.text">Nur frei zugängliche Quellen · Dateien bleiben lokal · keine Anlageberatung</footer>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dlg-help" class="dialog help"></dialog>
  <dialog id="dlg-preview" class="dialog preview"></dialog>
</body>
</html>
